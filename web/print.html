<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18201D">
<title>Menu em realidade aumentada</title>
<link rel="stylesheet" href="/vendor/letras/bricolage.css">
<link rel="stylesheet" href="/vendor/letras/figtree.css">
<link rel="stylesheet" href="/css/base.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; }
  #ar { position: fixed; inset: 0; }
  .ecra {
    position: fixed; inset: 0; z-index: 30; display: grid; grid-template-rows: auto 1fr auto; gap: 20px;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
    background: var(--tinta); color: var(--porcelana); text-align: center;
  }
  .ecra-topo { display: flex; justify-content: center; align-items: center; gap: 10px; }
  .ecra-topo img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
  .ecra-topo strong { font: 700 1.125rem var(--f-titulo); }
  .ilustracao { position: relative; display: grid; place-items: center; }
  .papel {
    position: relative; width: min(58vw, 230px); aspect-ratio: 3 / 4; border-radius: 10px; background: #FBFAF5; transform: rotate(-5deg);
    box-shadow: 0 30px 50px -20px rgba(0,0,0,.6);
  }
  .papel::before { content: ""; position: absolute; inset: 34px 26px; background: repeating-linear-gradient(180deg, transparent 0 22px, #E6E4DA 22px 25px); }
  .papel::after { content: ""; position: absolute; top: 18px; left: 26px; width: 46%; height: 10px; border-radius: 3px; background: var(--acento); opacity: .85; }
  .moldura { position: absolute; width: min(72vw, 290px); aspect-ratio: 3 / 4; }
  .moldura i { position: absolute; width: 34px; height: 34px; border: 4px solid var(--dende); }
  .moldura i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .moldura i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .moldura i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .moldura i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .moldura { animation: respirar 2.4s ease-in-out infinite; }
  @keyframes respirar { 50% { transform: scale(1.04); } }
  .prato-flutua { position: absolute; top: 18%; right: 20%; width: 74px; height: 74px; border-radius: 50%; background: var(--prato); box-shadow: 0 16px 24px -10px rgba(0,0,0,.6); animation: flutua 3s ease-in-out infinite; }
  .prato-flutua::after { content: ""; position: absolute; inset: 26%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #F7D48A, var(--dende)); }
  @keyframes flutua { 50% { transform: translateY(-10px); } }
  .ecra h1 { font-size: clamp(1.9rem, 8.5vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; }
  .ecra p { max-width: 30ch; margin: 10px auto 0; color: rgba(245,245,241,.7); }
  .ecra .btn { width: min(100%, 360px); margin: 22px auto 0; min-height: 56px; font-size: 1.0625rem; }
  .ecra .aviso { margin-top: 14px; text-align: left; }

  .dica { position: fixed; z-index: 20; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; align-items: center; gap: .55rem; background: rgba(24,32,29,.8); color: #fff; padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .9375rem; white-space: nowrap; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .dica::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dende); animation: respirar 1.2s ease-in-out infinite; }

  .cartao-prato {
    position: fixed; z-index: 20; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto;
    display: grid; grid-template-columns: 64px 1fr; gap: 6px 14px; align-items: center;
    background: var(--porcelana); border-radius: var(--r-l); padding: 14px; box-shadow: 0 20px 40px -14px rgba(0,0,0,.6);
    animation: subir .35s var(--facil);
  }
  @keyframes subir { from { transform: translateY(30px); opacity: 0; } }
  .cartao-prato .foto { width: 64px; height: 64px; border-radius: 50%; background: var(--prato); position: relative; grid-row: span 2; }
  .cartao-prato .foto img { position: absolute; inset: 8%; width: 84%; height: 84%; object-fit: contain; }
  .cartao-prato .linha { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .cartao-prato h2 { font-size: 1.1875rem; }
  .cartao-prato strong { font: 700 1rem var(--f-titulo); white-space: nowrap; }
  .cartao-prato p { color: var(--musgo); font-size: .875rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cartao-prato .acoes { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
  .mindar-ui-overlay { z-index: 10 !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three150/three.module.js",
  "three/addons/": "/vendor/three150/addons/"
} }
</script>
</head>
<body>
<div id="ar"></div>

<section id="inicio" class="ecra">
  <div class="ecra-topo"><img id="logo" class="oculto" alt=""><strong id="nome">Menu</strong></div>
  <div class="ilustracao" aria-hidden="true">
    <div class="papel"></div>
    <div class="moldura"><i></i><i></i><i></i><i></i></div>
    <div class="prato-flutua"></div>
  </div>
  <div>
    <h1>O menu ganha vida</h1>
    <p>Aponta a câmara ao menu impresso e toca nos pontos dourados para ver cada prato em 3D.</p>
    <button id="comecar" class="btn acento"><svg class="ic"><use href="/img/icones.svg#camara"/></svg>Abrir a câmara</button>
    <p id="erro" class="aviso erro oculto"></p>
  </div>
</section>

<p id="dica" class="dica oculto" aria-live="polite"><span id="dica-texto">Aponta para o menu impresso</span></p>

<div id="cartao" class="cartao-prato oculto" aria-live="polite">
  <span class="foto"><img id="c-foto" alt=""></span>
  <div class="linha"><h2 id="c-nome"></h2><strong id="c-preco"></strong></div>
  <p id="c-desc"></p>
  <div class="acoes">
    <a id="c-mesa" class="btn acento">Ver na minha mesa</a>
    <button id="c-fechar" class="btn secundario icone" aria-label="Fechar"><svg class="ic"><use href="/img/icones.svg#fechar"/></svg></button>
  </div>
</div>

<script type="module" src="/js/print.js"></script>
</body>
</html>
